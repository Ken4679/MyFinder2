name: Build Lightweight Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ published, created ]

jobs:
  build-tauri-windows:
    name: Build Ultra-Lightweight Windows EXE (<5MB)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          node scripts/generate-icons.cjs
          npm run build

      - name: Build Tauri EXE (Standalone Ultra-Lightweight Portable)
        run: |
          npx @tauri-apps/cli build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy & Organize EXE Artifacts
        shell: bash
        run: |
          mkdir -p dist_portable
          # Copy standalone portable EXE
          if [ -f src-tauri/target/release/myfinder.exe ]; then
            cp src-tauri/target/release/myfinder.exe dist_portable/MyFinder-Portable-2.0.0.exe
          fi
          # Copy setup installers if generated
          if [ -d src-tauri/target/release/bundle ]; then
            cp -r src-tauri/target/release/bundle/* dist_portable/ 2>/dev/null || true
          fi

      - name: Upload Small EXE Artifacts (Download in Actions)
        uses: actions/upload-artifact@v4
        with:
          name: MyFinder-Lightweight-Windows-EXE
          path: |
            dist_portable/*
            src-tauri/target/release/*.exe
          if-no-files-found: warn

      - name: Upload Release Asset (if Release published)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_portable/*.exe
            dist_portable/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
